name: Build Nico APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Accept SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        shell: bash
        run: |
          ROOT=$(dirname "$(find . -name 'settings.gradle*' | head -1)")
          cd "$ROOT"
          gradle assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          { echo '## Build errors'; echo '```'; grep -E "^e: |error:|What went wrong|Could not|Execution failed" -A3 build.log | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Nico-APK
          path: '**/build/outputs/apk/debug/*.apk'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
